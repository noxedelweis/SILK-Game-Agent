name: Publish SILK Game Agent v0.5.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v050.yml'
      - 'release-assets/v0.5.0/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode SHA-256 pinned release and inspect portable Windows PE
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile
          source=Path('release-assets/v0.5.0')
          dest=Path('dist')
          dest.mkdir(exist_ok=True)
          expected={
              'SILK_Game_Agent.exe':'96b362fd8b8f66e1b0211fb8f86e2557920658db25a8821a29fbcc0156fcefa9',
              'SILK_Game_Agent_v0.5.0.zip':'e5acb9628f4bee3072fd9b2ba6835e151fd9a528b2bb4c77b393634c0fa0d3d0',
          }
          for name,digest in expected.items():
              b64=(source/(name+'.b64')).read_text(encoding='ascii').strip()
              binary=base64.b64decode(b64,validate=True)
              found=hashlib.sha256(binary).hexdigest()
              if found!=digest:raise RuntimeError(f'{name}: unexpected SHA-256 {found}')
              (dest/name).write_bytes(binary)
              print(name,len(binary),'OK')
          exe=(dest/'SILK_Game_Agent.exe').read_bytes()
          pe_offset=int.from_bytes(exe[0x3c:0x40],'little')
          assert exe[:2]==b'MZ' and exe[pe_offset:pe_offset+6]==b'PE\x00\x00\x64\x86'
          with zipfile.ZipFile(dest/'SILK_Game_Agent_v0.5.0.zip') as archive:
              assert archive.testzip() is None
              assert 'SILK_Game_Agent_v0.5.0/knowledge_cli.py' in archive.namelist()
          PY
      - name: Publish v0.5.0 only if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release v0.5.0'
            exit 0
          fi
          gh release create v0.5.0 \
            dist/SILK_Game_Agent.exe \
            dist/SILK_Game_Agent_v0.5.0.zip \
            --target main \
            --title 'SILK Game Agent v0.5.0 — Navigation 2.0' \
            --notes 'Supervised 1-3 relative waypoints, bounded WASD navigation with feedback, obstacle and unexpected-direction stop checks; optional read-only OpenMW 0.51 Lua environment probe for yaw, doors and actors. Probe requires separate explicit approval and OpenMW restart. Existing v0.3 bridge, mods, saves and wiki are preserved. 85 local unit tests passed, one Windows-specific test skipped under Linux. Real multi-waypoint movement and the new Lua probe are NOT yet validated on the users Windows/OpenMW.'
